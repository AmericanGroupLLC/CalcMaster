# Test runner configuration.
#
# The `design` tag marks render-only harnesses that write PNG review artifacts
# rather than asserting behaviour. They are skipped by default so a pixel
# difference (or a machine without the expected system fonts) can never fail
# CI. Run them deliberately with:
#
#   flutter test --run-skipped --update-goldens --tags design
#
tags:
  design:
    skip: "Render-only; run with --run-skipped --update-goldens --tags design"
