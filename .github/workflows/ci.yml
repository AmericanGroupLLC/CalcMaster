name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Flutter: Lint, Test, Coverage ───
  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Test + coverage gate
        run: bash tool/coverage.sh
      - uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.filtered.info
          fail_ci_if_error: true
          flags: flutter
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ─── Backend: Lint, Test ───
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: calcmaster
          POSTGRES_PASSWORD: calcmaster_dev
          POSTGRES_DB: calcmaster_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test -- --coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: calcmaster
          DB_PASSWORD: calcmaster_dev
          DB_NAME: calcmaster_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci_test_secret
          NODE_ENV: test

  # ─── Security Scanning ───
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency audit (Flutter)
        run: dart pub outdated --json || true
      - name: Dependency audit (Backend)
        working-directory: backend
        run: npm audit --audit-level=high || true
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # ─── Build Android ───
  build-android:
    runs-on: ubuntu-latest
    needs: [flutter-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  # ─── Build iOS ───
  build-ios:
    runs-on: macos-14
    needs: [flutter-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Archive unsigned app
        run: |
          cd build/ios/iphoneos
          tar czf ../../../ios-unsigned.tar.gz Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: ios-unsigned.tar.gz

  # ─── Build Web ───
  build-web:
    runs-on: ubuntu-latest
    needs: [flutter-test, backend-test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter build web --release --wasm
      - uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: build/web

  # ─── Build Backend Docker ───
  build-backend:
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        working-directory: backend
        run: docker build -t calcmaster-api:${{ github.sha }} .

  # ─── Integration Tests ───
  integration:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release'
    runs-on: macos-14
    needs: flutter-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.24.x', channel: stable, cache: true }
      - run: flutter pub get
      - name: Boot iOS sim
        run: xcrun simctl boot "iPhone 15" || true
      - run: flutter test integration_test/
