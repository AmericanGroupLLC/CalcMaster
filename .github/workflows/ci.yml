name: CI — CalcMaster

# Verifies the Flutter app that actually ships.
#
# The previous version of this workflow ran the legacy React Native Jest suite
# under `|| true` and then echoed a summary — it never invoked flutter analyze,
# flutter test or any build, and could not fail. Nothing gated a merge.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  repository_dispatch:
    types: [agl-manifest-build]

env:
  # Matches the SDK the project is developed against.
  FLUTTER_VERSION: '3.44.8'

jobs:
  analyze-test:
    name: Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        # Info-level lints (UPPERCASE RegionId enum values, terse for-bodies)
        # are pre-existing and intentional — see AGENTS.md "Gotchas". Warnings
        # and errors still fail the job.
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: Build Android (AAB)
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches compileOptions/kotlinOptions in android/app/build.gradle.kts.
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build release App Bundle
        # android/key.properties is gitignored, so this bundle is DEBUG-SIGNED
        # and is not uploadable to Play. It proves the release toolchain
        # (R8 minification + resource shrinking) compiles cleanly.
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: calcmaster-release-aab
          path: build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        # Catches CocoaPods/Xcode-project breakage that cannot be reproduced on
        # Linux. Unsigned, so no certificates are needed.
        run: flutter build ios --release --no-codesign

      - name: Verify privacy manifest is bundled
        # PrivacyInfo.xcprivacy must reach the .app or App Store validation
        # rejects the upload.
        run: |
          APP=build/ios/iphoneos/Runner.app
          if [ ! -f "$APP/PrivacyInfo.xcprivacy" ]; then
            echo "::error::PrivacyInfo.xcprivacy is missing from $APP"
            exit 1
          fi
          echo "PrivacyInfo.xcprivacy is bundled."
