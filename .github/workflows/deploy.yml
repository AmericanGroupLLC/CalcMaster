name: Deploy (Fastlane)

# Manual trigger (pick platform + lane) or automatic on a version tag.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        type: choice
        options: [ios, android, both]
        default: both
      lane:
        description: "Lane"
        type: choice
        options: [beta, release]
        default: beta
  push:
    tags: ['v*']   # tag push -> beta on both platforms

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.x'

jobs:
  android:
    if: ${{ github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'both' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.x', channel: stable, cache: true }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }

      - name: Materialize signing + Play secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          EOF
          echo "$PLAY_SERVICE_ACCOUNT_JSON" > fastlane/play-service-account.json

      - run: flutter pub get
      - name: Fastlane
        env:
          PLAY_JSON_KEY_FILE: fastlane/play-service-account.json
        run: bundle exec fastlane android ${{ github.event_name == 'push' && 'beta' || inputs.lane }}

  ios:
    if: ${{ github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'both' }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.x', channel: stable, cache: true }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }

      - run: flutter pub get
      - name: Fastlane
        env:
          CI: "true"
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}            # base64-encoded .p8 (Key ID + Issuer baked into Fastfile)
          FASTLANE_APPLE_ID: ${{ secrets.FASTLANE_APPLE_ID }}
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}    # base64 of the distribution cert + private key (.p12)
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}                     # unique CFBundleVersion per CI run
        run: bundle exec fastlane ios ${{ github.event_name == 'push' && 'release' || inputs.lane }}
