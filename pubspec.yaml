name: calcmaster
description: "World calculator and converter — Flutter version."
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  intl: ^0.20.0
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  # ───── Real monetization SDKs (test creds work without accounts) ─────
  google_mobile_ads: ^5.3.1
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/

# ──────────────────────────────────────────────
# App icon generation (run: dart run flutter_launcher_icons)
# Source PNGs are produced by tools/gen_icon.dart
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0B1020"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ──────────────────────────────────────────────
# Splash screen generation (run: dart run flutter_native_splash:create)
# ──────────────────────────────────────────────
flutter_native_splash:
  color: "#0B1020"
  image: "assets/splash/splash_logo.png"
  android_12:
    color: "#0B1020"
    image: "assets/splash/splash_logo.png"
  ios: true
  android: true
  fullscreen: false
