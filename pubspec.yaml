name: calcmaster
description: "World calculator and converter — Flutter version."
publish_to: 'none'
version: 4.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  go_router: ^14.6.2
  shared_preferences: ^2.3.3
  http: ^1.2.2
  intl: ^0.19.0  # pinned to match flutter_localizations on Flutter 3.24.x (0.20.0 needs newer Flutter)
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  flutter_svg: ^2.0.16
  url_launcher: ^6.3.1
  # ───── Real monetization SDKs (test creds work without accounts) ─────
  google_mobile_ads: ^5.3.1
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  image: ^4.3.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

# Pin archive to the 3.x line: the `image` package's EXR codec references
# `ZLibDecoder`, which archive 4.x removed — without this the icon/splash
# generation tooling fails to compile under the current Dart SDK.
dependency_overrides:
  archive: ^3.6.1

flutter:
  uses-material-design: true
  generate: true
  # google_mobile_ads is CocoaPods-only, but webview_flutter_wkwebview resolves
  # via Swift Package Manager — the two collide during `pod install`. The pinned
  # Flutter 3.24.x keeps SPM off by default, so no extra config is needed here.
  # (The `config: enable-swift-package-manager` key only exists in newer Flutter
  # and is rejected by 3.24.x with "Unexpected child config under flutter".)
  assets:
    - assets/icons/

# ──────────────────────────────────────────────
# App icon generation (run: dart run flutter_launcher_icons)
# Source PNGs are produced by tools/gen_icon.dart
# ──────────────────────────────────────────────
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#0B1020"
  adaptive_icon_background: "#0B1020"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

# ──────────────────────────────────────────────
# Splash screen generation (run: dart run flutter_native_splash:create)
# ──────────────────────────────────────────────
flutter_native_splash:
  color: "#0B1020"
  image: "assets/splash/splash_logo.png"
  android_12:
    color: "#0B1020"
    image: "assets/splash/splash_logo.png"
  ios: true
  android: true
  fullscreen: false
