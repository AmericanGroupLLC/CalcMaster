<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Brand gradient: violet accent -> sky blue, drawn from app tokens -->
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="0.55" stop-color="#5A6BFF"/>
      <stop offset="1" stop-color="#3FA9FF"/>
    </linearGradient>
    <!-- Soft mint glow anchored to the base for depth -->
    <radialGradient id="glow" cx="0.5" cy="0.9" r="0.75" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#5CE0A8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5CE0A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="280" y1="360" x2="760" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF2FF"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed opaque background (iOS/Android mask the corners themselves) -->
  <rect width="1024" height="1024" fill="#0B1020"/>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Convert + calculate mark: paired swap bars that also read as an "=" sign -->
  <g fill="url(#glyph)">
    <!-- Top bar: points right (convert forward) -->
    <rect x="268" y="418" width="360" height="70" rx="35"/>
    <path d="M604 383 L724 453 L604 523 Z"/>
    <!-- Bottom bar: points left (convert back) -->
    <rect x="396" y="536" width="360" height="70" rx="35"/>
    <path d="M420 501 L300 571 L420 641 Z"/>
  </g>

  <!-- Calculator plus/operator accent, keeps it reading as a calculator too -->
  <g fill="#0B1020" fill-opacity="0.0"/>
</svg>
