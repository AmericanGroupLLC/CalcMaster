# Sized for a 7-8 GB dev machine. -Xmx8G crashed the daemon at startup
# ("insufficient memory ... G1 virtual space") because the heap request
# exceeded total system RAM. Raise only if the build box has the headroom.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
