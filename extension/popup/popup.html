<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalcMaster</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="logo">
        <img src="../icons/icon-32.png" alt="" width="24" height="24">
        <span class="title">CalcMaster</span>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab active" data-panel="calc" role="tab" aria-selected="true">Calc</button>
        <button class="tab" data-panel="convert" role="tab" aria-selected="false">Convert</button>
        <button class="tab" data-panel="finance" role="tab" aria-selected="false">Finance</button>
      </nav>
    </header>

    <main>
      <section id="panel-calc" class="panel active" role="tabpanel">
        <div class="display">
          <div id="calc-expr" class="expr"></div>
          <div id="calc-result" class="result">0</div>
        </div>
        <div class="keypad">
          <button class="key fn" data-action="clear">C</button>
          <button class="key fn" data-action="backspace">&larr;</button>
          <button class="key fn" data-action="percent">%</button>
          <button class="key op" data-action="input" data-val="/">&divide;</button>
          <button class="key" data-action="input" data-val="7">7</button>
          <button class="key" data-action="input" data-val="8">8</button>
          <button class="key" data-action="input" data-val="9">9</button>
          <button class="key op" data-action="input" data-val="*">&times;</button>
          <button class="key" data-action="input" data-val="4">4</button>
          <button class="key" data-action="input" data-val="5">5</button>
          <button class="key" data-action="input" data-val="6">6</button>
          <button class="key op" data-action="input" data-val="-">&minus;</button>
          <button class="key" data-action="input" data-val="1">1</button>
          <button class="key" data-action="input" data-val="2">2</button>
          <button class="key" data-action="input" data-val="3">3</button>
          <button class="key op" data-action="input" data-val="+">+</button>
          <button class="key zero" data-action="input" data-val="0">0</button>
          <button class="key" data-action="input" data-val=".">.</button>
          <button class="key eq" data-action="equals">=</button>
        </div>
      </section>

      <section id="panel-convert" class="panel" role="tabpanel">
        <div class="convert-group">
          <label for="convert-category">Category</label>
          <select id="convert-category">
            <option value="distance">Distance</option>
            <option value="weight">Weight</option>
            <option value="temperature">Temperature</option>
            <option value="volume">Volume</option>
            <option value="speed">Speed</option>
            <option value="area">Area</option>
            <option value="data">Data Size</option>
            <option value="pressure">Pressure</option>
            <option value="energy">Energy</option>
          </select>
        </div>
        <div class="convert-row">
          <input id="convert-from-val" type="number" placeholder="0" step="any" aria-label="Value to convert">
          <select id="convert-from-unit" aria-label="From unit"></select>
        </div>
        <button id="convert-swap" class="swap-btn" aria-label="Swap units">&#8645;</button>
        <div class="convert-row">
          <input id="convert-to-val" type="text" readonly aria-label="Converted value">
          <select id="convert-to-unit" aria-label="To unit"></select>
        </div>
      </section>

      <section id="panel-finance" class="panel" role="tabpanel">
        <div class="finance-tool">
          <label for="finance-mode">Tool</label>
          <select id="finance-mode">
            <option value="tip">Tip Calculator</option>
            <option value="discount">Discount</option>
            <option value="percentage">Percentage</option>
          </select>
        </div>
        <div id="finance-fields"></div>
        <div id="finance-result" class="finance-result"></div>
      </section>
    </main>

    <footer>
      <a href="#" id="open-full-app" class="full-app-link">Open full app &rarr;</a>
    </footer>
  </div>
  <script src="popup.js" type="module"></script>
</body>
</html>
