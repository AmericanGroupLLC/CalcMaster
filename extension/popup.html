<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalMaster</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 320px; min-height: 400px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f0f0f; color: #fff; }
    .header { background: #37474F; padding: 16px; display: flex; align-items: center; gap: 12px; }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p { font-size: 12px; opacity: 0.8; }
    .content { padding: 16px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #333; }
    .card h3 { font-size: 14px; font-weight: 600; margin-bottom: 8px; color: #37474F; }
    .card p { font-size: 12px; color: #aaa; line-height: 1.5; }
    .btn { width: 100%; padding: 12px; background: #37474F; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4caf50; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #4caf50; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>CalMaster</h1>
      <p>Scientific calculator & unit converter</p>
    </div>
  </div>
  <div class="content">
    <div class="card">
      <div class="status"><div class="dot"></div><span>Connected to AmericanGroupLLC API</span></div>
    </div>
    <div class="card">
      <h3>Quick Access</h3>
      <p>Access Scientific calculator & unit converter features directly from your browser.</p>
      <button class="btn" id="openApp">Open CalMaster</button>
    </div>
    <div class="card">
      <h3>Notifications</h3>
      <p>Stay updated with real-time alerts from CalMaster.</p>
      <button class="btn" id="toggleNotif">Enable Notifications</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
